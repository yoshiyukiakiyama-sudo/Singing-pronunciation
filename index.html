<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SingingPronunciationLab</title>
<style>
  body { font-family: sans-serif; margin: 0; background: #f6f7fb; color: #222; }
  header { background: #4a5bd4; color: #fff; padding: 12px 16px; position: sticky; top: 0; z-index: 1; }
  h1 { font-size: 1.1rem; margin: 0; }
  main { padding: 12px; max-width: 720px; margin: auto; }
  button { font-size: 1rem; padding: 10px 16px; border: 0; border-radius: 8px; background: #4a5bd4; color: #fff; }
  button.sub { background: #888; }
  .song { display: block; width: 100%; text-align: left; background: #fff; color: #222; margin: 8px 0; padding: 14px; box-shadow: 0 1px 3px #0003; }
  .line { background: #fff; margin: 8px 0; padding: 10px 14px; border-radius: 8px; box-shadow: 0 1px 3px #0002; cursor: pointer; }
  .line.active { background: #fff3c4; }
  .orig { font-size: 1.15rem; font-weight: bold; }
  .word { border-bottom: 1px dotted #888; cursor: pointer; }
  .pron { color: #b03a7a; margin-top: 2px; }
  .tran { color: #555; font-size: .9rem; margin-top: 2px; }
  .bar { display: flex; gap: 8px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
  .hint { color: #666; font-size: .9rem; }
  .notice { background: #fff8e1; border-left: 4px solid #e0a800; padding: 10px 12px; margin: 12px 0; font-size: .9rem; }
  .notice p { margin: 4px 0; }
  .error { background: #fdecea; border-left: 4px solid #d32f2f; padding: 10px 12px; margin: 12px 0; font-size: .95rem; }
  .error small { display: block; color: #777; margin-top: 4px; }
</style>
</head>
<body>
<header><h1>🎤 SingingPronunciationLab</h1></header>
<main id="app"></main>
<script>
const app = document.getElementById("app");
let timer = null, playing = false, rate = 0.6;

function errorHtml(text, detail) {
  return `<div class="error">${esc(text)}${detail ? `<small>（詳細: ${esc(detail)}）</small>` : ""}</div>`;
}

async function fetchJson(url) {
  const res = await fetch(url, { cache: "no-cache" });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

function showSpeechMessage(text) {
  let box = document.getElementById("speechMsg");
  if (!box) return;
  box.innerHTML = text ? errorHtml(text) : "";
}

async function showList() {
  stop();
  let songs;
  try {
    songs = await fetchJson("songs/index.json");
  } catch (e) {
    app.innerHTML = errorHtml("曲の一覧を読み込めませんでした。通信状況を確認して、ページを再読み込みしてください。", e.message);
    return;
  }
  app.innerHTML = songs.length ? "" : "<p>曲がまだありません</p>";
  for (const s of songs) {
    const b = document.createElement("button");
    b.className = "song";
    b.textContent = `${s.title}　${s.artist}（${s.language}）`;
    b.onclick = () => showSong(s.id);
    app.appendChild(b);
  }
}

async function showSong(id) {
  stop();
  let d;
  try {
    d = await fetchJson(`songs/${encodeURIComponent(id)}.json`);
  } catch (e) {
    app.innerHTML = `<div class="bar"><button class="sub" id="back">← 一覧</button></div>`
      + errorHtml("曲のデータを読み込めませんでした。通信状況を確認して、もう一度お試しください。", e.message);
    document.getElementById("back").onclick = showList;
    return;
  }
  app.innerHTML = `
    <div class="bar"><button class="sub" id="back">← 一覧</button>
    <button id="playAll">▶ 発音再生</button>
    <button class="sub" id="stop">■ 停止</button></div>
    <div class="bar"><label>速度 <input type="range" id="rate" min="0.2" max="1" step="0.1" value="${rate}"></label></div>
    <div id="speechMsg"></div>
    <h2>${esc(d.title)} <small>${esc(d.artist || "")}</small></h2>
    <aside class="notice">
      <p><strong>生成モデル：</strong>${esc(d.generation_model || "記録なし")}</p>
      <p>翻訳はAIによる簡易訳です。文脈や詩的表現などを十分に反映できず、意味が不正確な場合があります。</p>
      <p>カタカナ表記は発音の目安です。カタカナでは原語の音やアクセントなどを正確に表現できず、実際の発音とは異なります。</p>
    </aside>
    <p class="hint">先頭の単語・カタカナ・訳語をタップ: 行を再生 / 先頭以外の単語をタップ: 直前の単語と合わせて再生</p><div id="lines"></div>`;
  const box = document.getElementById("lines");
  d.lines.forEach((l, i) => {
    const el = document.createElement("div");
    el.className = "line";
    const original = document.createElement("div");
    original.className = "orig";
    if (/\s/.test(l.original.trim())) {
      const originalWords = l.original.trim().split(/\s+/);
      let wordIndex = 0;
      for (const part of l.original.split(/(\s+)/)) {
        if (!part) continue;
        if (/^\s+$/.test(part)) {
          original.appendChild(document.createTextNode(part));
        } else {
          const word = document.createElement("span");
          word.className = "word";
          word.textContent = part;
          const index = wordIndex++;
          word.addEventListener("click", event => {
            event.stopPropagation();
            stop();
            if (index === 0) {
              speak(d, i);
              return;
            }
            speakText(d, i, `${originalWords[index - 1]} ${part}`);
          });
          original.appendChild(word);
        }
      }
    } else {
      original.textContent = l.original;
    }
    const pronunciation = document.createElement("div");
    pronunciation.className = "pron";
    pronunciation.textContent = l.pronunciation;
    const translation = document.createElement("div");
    translation.className = "tran";
    translation.textContent = l.translation;
    el.append(original, pronunciation, translation);
    el.addEventListener("click", () => {
      stop();
      speak(d, i);
    });
    box.appendChild(el);
  });
  document.getElementById("back").onclick = showList;
  document.getElementById("stop").onclick = stop;
  document.getElementById("rate").oninput = e => rate = +e.target.value;
  document.getElementById("playAll").onclick = () => { stop(); playing = true; playFrom(d, 0); };
}

function speak(d, i, onend) {
  speakText(d, i, d.lines[i].original, onend);
}

function speakText(d, i, text, onend) {
  const els = document.querySelectorAll(".line");
  els.forEach(e => e.classList.remove("active"));
  els[i].classList.add("active");
  els[i].scrollIntoView({ block: "center", behavior: "smooth" });
  if (!("speechSynthesis" in window)) {
    showSpeechMessage("このブラウザは音声再生に対応していません。ChromeやEdgeなど別のブラウザでお試しください。");
    playing = false;
    return;
  }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = d.lang_code;
  const voices = speechSynthesis.getVoices();
  const lang = d.lang_code.toLowerCase();
  const voice = voices.find(v => v.lang.toLowerCase().replace("_", "-") === lang)
    || voices.find(v => v.lang.toLowerCase().replace("_", "-").split("-")[0] === lang.split("-")[0])
    || null;
  u.voice = voice;
  if (voice) {
    showSpeechMessage("");
  } else if (voices.length) {
    showSpeechMessage(`この端末には${d.language || "この言語"}の音声が入っていないため、音が出ない、または正しく読み上げられない場合があります。端末の設定で音声データを追加してください。`);
  }
  u.rate = rate;
  u.onend = onend || null;
  u.onerror = e => {
    if (e.error === "canceled" || e.error === "interrupted") return;
    playing = false;
    showSpeechMessage("音声を再生できませんでした。端末の音量や、音声データの追加をご確認ください。");
  };
  speechSynthesis.speak(u);
}

if ("speechSynthesis" in window) {
  speechSynthesis.getVoices();
}

function playFrom(d, i) {
  if (!playing || i >= d.lines.length) { playing = false; return; }
  speak(d, i, () => { timer = setTimeout(() => playFrom(d, i + 1), 300); });
}

function stop() {
  playing = false;
  clearTimeout(timer);
  if ("speechSynthesis" in window) speechSynthesis.cancel();
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

showList();
</script>
</body>
</html>
